input_predictions: /ssd/czx/czx_work/cot_blueprint_refine/subsets/qwen3_8b_original_answer_incorrect/predictions.jsonl
output_base: /ssd/czx/czx_work/cot_blueprint_refine
exp_name: qwen3_8b_397b_wrong76_llm_split_v6
resume: true
include_ids: []
python_bin: /ssd/miniconda3/envs/lean4-czx/bin/python

vllm:
  # The splitter iteration attaches to the already-running 397B endpoint and
  # must never acquire ownership of, restart, or terminate that service.
  use_existing: true

shared_vllm_397b:
  model_path: /ssd/czx/models/Qwen3.5-397B-A17B-FP8
  served_model_name: Qwen3.5-397B-A17B-FP8
  max_model_len: 40960
  max_num_seqs: 512
  gpu_memory_utilization: 0.95
  trust_remote_code: true

cot_splitter:
  mode: llm_boundary_v6
  model: Qwen3.5-397B-A17B-FP8
  openai_base_url: http://127.0.0.1:8001/v1
  vllm: ${shared_vllm_397b}
  temperature: 0.0
  max_tokens: 2048
  concurrency: 24
  timeout_s: 600
  max_attempts: 2
  enable_thinking: false
  fallback_on_error: false
  atomizer_version: cot-atomizer-v1
  prompt_version: cot-split-boundaries-v6

blueprint:
  model: Qwen3.5-397B-A17B-FP8
  openai_base_url: http://127.0.0.1:8001/v1
  vllm: ${shared_vllm_397b}
  retry_error_results: false
  generation_max_tokens: 16384
  prover_max_tokens: 4096
  prover_length_retry_max_tokens: 8192
  max_refinement_iterations: 1
  blueprint_max_retries: 4
  node_max_prove_turns: 4
  node_max_negation_probe_turns: 0
  max_tool_calls_per_turn: 3
  phase1_concurrency: 512
  phase2_blueprint_concurrency: 512
  phase2_node_concurrency: 512
  refine_concurrency: 256
  phase2_contract_check_concurrency: 32
  lean_api_url: http://127.0.0.1:8000
  lean_server_timeout: 600
  lean_max_inflight_snippets: 48
  lean_batch_size: 8
  lean_global_batching: true
  lean_parallel_batches: 6
  lean_batch_wait_ms: 10
  semantic_fidelity_enabled: true
  semantic_require_step_ids: true
  semantic_static_gate: true
  semantic_minimal_ir: true
  semantic_freeze_refinement: true
  semantic_audit_mode: none
  semantic_audit_max_tokens: 2048
  semantic_max_repair_attempts: 1
  proof_policy: first_failed_wave
  critical_negation_max_turns: 1

export:
  workers: 128

refine:
  model: Qwen3.5-397B-A17B-FP8
  source_solution_model_label: Qwen3-8B
  concurrency: 24
  vllm: ${shared_vllm_397b}
  temperature: 0.6
  max_tokens: 20480
  concise_recovery_max_tokens: 8192
  strict_final_envelope: false
  timeout_s: 3600
  variants:
    blueprint:
      enabled: true
      prompt_mode: blueprint
    cot_only:
      enabled: false
      prompt_mode: cot_only

judge:
  enabled: false
  concurrency: 512
