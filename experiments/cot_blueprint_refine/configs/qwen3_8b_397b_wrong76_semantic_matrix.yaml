input_predictions: /ssd/czx/czx_work/cot_blueprint_refine/subsets/qwen3_8b_original_answer_incorrect/predictions.jsonl
output_base: /ssd/czx/czx_work/cot_blueprint_refine
exp_name: qwen3_8b_397b_wrong76_semantic_matrix
resume: true
include_ids: []
python_bin: /ssd/miniconda3/envs/lean4-czx/bin/python

shared_vllm_397b:
  model_path: /ssd/czx/models/Qwen3.5-397B-A17B-FP8
  served_model_name: Qwen3.5-397B-A17B-FP8
  max_model_len: 40960
  max_num_seqs: 512
  gpu_memory_utilization: 0.95
  trust_remote_code: true

blueprint:
  model: Qwen3.5-397B-A17B-FP8
  openai_base_url: http://127.0.0.1:8001/v1
  vllm: ${shared_vllm_397b}
  retry_error_results: false
  generation_max_tokens: 16384
  prover_max_tokens: 4096
  prover_length_retry_max_tokens: 8192
  max_refinement_iterations: 1
  blueprint_max_retries: 4
  node_max_prove_turns: 4
  node_max_negation_probe_turns: 0
  max_tool_calls_per_turn: 3
  phase1_concurrency: 512
  phase2_blueprint_concurrency: 512
  phase2_node_concurrency: 512
  refine_concurrency: 256
  phase2_contract_check_concurrency: 32
  lean_api_url: http://127.0.0.1:8000
  lean_server_timeout: 600
  lean_max_inflight_snippets: 48
  lean_batch_size: 8
  lean_global_batching: true
  lean_parallel_batches: 6
  lean_batch_wait_ms: 10

  # These are translated by run_experiment into flat RobustPA Hydra keys.
  semantic_fidelity_enabled: false
  semantic_require_step_ids: false
  semantic_static_gate: false
  semantic_minimal_ir: false
  semantic_freeze_refinement: false
  semantic_audit_mode: none
  semantic_audit_max_tokens: 2048
  semantic_max_repair_attempts: 0
  proof_policy: full
  critical_negation_max_turns: 0

export:
  workers: 128

refine:
  model: Qwen3.5-397B-A17B-FP8
  source_solution_model_label: Qwen3-8B
  # A 512-request live run saturated the 40K-context KV cache and caused
  # hidden timeout/recompute waves.  Keep the server capacity independent,
  # but bound long 20K refinement generations to the measured safe range.
  concurrency: 24
  vllm: ${shared_vllm_397b}
  temperature: 0.6
  max_tokens: 20480
  concise_recovery_max_tokens: 8192
  timeout_s: 3600
  variants:
    blueprint:
      enabled: true
      prompt_mode: blueprint
    cot_only:
      enabled: false
      prompt_mode: cot_only

judge:
  enabled: false
  concurrency: 512

matrix:
  output_prefix: qwen3_8b_397b_wrong76_semantic
  default_run_id: sem_v1
  legacy_root: /ssd/czx/czx_work/cot_blueprint_refine/qwen3_8b_397b_refine_ablation_410
  subset_metrics: /ssd/czx/czx_work/cot_blueprint_refine/subsets/qwen3_8b_original_answer_incorrect/metrics.json
  add_arms: [E0, E1, E2, E3, E4, E5, E6]
  reduce_arms: [R1, R2, R3, R4, R5, R6]
  key_refine_arms: [E0, E4, E6, R3, R6]
  code_roots:
    - src
    - prompts
    - experiments/robustpa_refine
    - experiments/cot_blueprint_refine

  # `features` is deliberately descriptive. run_semantic_matrix.py maps every
  # supported entry to the corresponding blueprint key above and refuses
  # unknown keys, so an intended ablation cannot silently become a no-op.
  arms:
    E0:
      label: Fresh current-pipeline baseline
      parent: legacy_E0
      features:
        fidelity_enabled: false
        require_step_ids: false
        static_gate: false
        minimal_ir: false
        freeze_refinement: false
        audit_mode: none
        max_repair_attempts: 0
        proof_policy: full
        critical_negation_max_turns: 0

    E1:
      label: Deterministic COT steps and mandatory node provenance
      parent: E0
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: false
        minimal_ir: false
        freeze_refinement: false
        audit_mode: none
        max_repair_attempts: 0
        proof_policy: full
        critical_negation_max_turns: 0

    E2:
      label: E1 plus static anti-degeneration gate
      parent: E1
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: false
        freeze_refinement: false
        audit_mode: none
        max_repair_attempts: 1
        proof_policy: full
        critical_negation_max_turns: 0

    E3:
      label: E2 plus minimal semantic IR
      parent: E2
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: true
        freeze_refinement: false
        audit_mode: none
        max_repair_attempts: 1
        proof_policy: full
        critical_negation_max_turns: 0

    E4:
      label: E3 plus refinement semantic freeze
      parent: E3
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: true
        freeze_refinement: true
        audit_mode: none
        max_repair_attempts: 1
        proof_policy: full
        critical_negation_max_turns: 0

    E5:
      label: E4 plus full batched semantic audit
      parent: E4
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: true
        freeze_refinement: true
        audit_mode: full
        max_repair_attempts: 1
        proof_policy: full
        critical_negation_max_turns: 0

    E6:
      label: Quality ceiling with a second targeted semantic repair
      parent: E5
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: true
        freeze_refinement: true
        audit_mode: full
        max_repair_attempts: 2
        proof_policy: first_failed_wave
        critical_negation_max_turns: 1

    R1:
      label: E6 with risk-routed audit
      parent: E6
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: true
        freeze_refinement: true
        audit_mode: risk
        max_repair_attempts: 2
        proof_policy: first_failed_wave
        critical_negation_max_turns: 1

    R2:
      label: R1 without model semantic audit; retain deterministic gates
      parent: R1
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: true
        freeze_refinement: true
        audit_mode: none
        max_repair_attempts: 2
        proof_policy: first_failed_wave
        critical_negation_max_turns: 1

    R3:
      label: R2 with one rather than two semantic repair attempts
      parent: R2
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: true
        freeze_refinement: true
        audit_mode: none
        max_repair_attempts: 1
        proof_policy: first_failed_wave
        critical_negation_max_turns: 1

    R4:
      label: R3 without minimal semantic IR
      parent: R3
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: false
        freeze_refinement: true
        audit_mode: none
        max_repair_attempts: 1
        proof_policy: first_failed_wave
        critical_negation_max_turns: 1

    R5:
      label: R4 without whole-blueprint Phase-3 rewrite
      parent: R4
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: false
        freeze_refinement: true
        audit_mode: none
        max_repair_attempts: 1
        proof_policy: first_failed_wave
        critical_negation_max_turns: 1
      overrides:
        blueprint:
          max_refinement_iterations: 0

    R6:
      label: R5 with critical-path proving and reduced budgets
      parent: R5
      features:
        fidelity_enabled: true
        require_step_ids: true
        static_gate: true
        minimal_ir: false
        freeze_refinement: true
        audit_mode: none
        max_repair_attempts: 1
        proof_policy: critical_path
        critical_negation_max_turns: 1
      overrides:
        blueprint:
          generation_max_tokens: 12288
          max_refinement_iterations: 0
          blueprint_max_retries: 3
          node_max_prove_turns: 3
          max_tool_calls_per_turn: 2
