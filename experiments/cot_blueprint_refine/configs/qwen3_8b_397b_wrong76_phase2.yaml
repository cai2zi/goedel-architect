# Phase 2-only continuation of qwen3_8b_397b_wrong76_blueprint_generation.
# It intentionally reuses that experiment's checkpoints and results.jsonl.
input_predictions: /ssd/czx/czx_work/cot_blueprint_refine/subsets/qwen3_8b_original_answer_incorrect/predictions.jsonl
output_base: /ssd/czx/czx_work/cot_blueprint_refine
exp_name: qwen3_8b_397b_wrong76_blueprint_generation
resume: true
vllm: {use_existing: true}
shared_vllm_397b: {reasoning_parser: qwen3}
kimina: {use_existing: true, auto_start: false, auto_destroy: false}
environment:
  GOEDEL_PROVER_MAX_TOKENS: "8192"
  GOEDEL_PROVER_LENGTH_RETRY_MAX_TOKENS: "8192"
  GOEDEL_PROVER_ENABLE_THINKING: "true"
  GOEDEL_PROVER_TEMPERATURE: "0.6"
  GOEDEL_PROVER_TOP_P: "0.95"
  GOEDEL_PROVER_TOP_K: "20"
  GOEDEL_PROVER_MIN_P: "0.0"
  GOEDEL_PROVER_PRESENCE_PENALTY: "0.0"
  GOEDEL_PROVER_REPETITION_PENALTY: "1.0"

blueprint:
  execution_mode: phase2_only
  retry_error_results: false
  max_refinement_iterations: 0

  # Phase 2 prover budget.
  node_max_prove_turns: 4
  node_max_negation_probe_turns: 4
  max_tool_calls_per_turn: 3
  proof_policy: full
  critical_negation_max_turns: 0

  # Phase 1 settings are inherited but unused in phase2_only mode.
  phase1_concurrency: 1
  phase2_blueprint_concurrency: 76
  phase2_node_concurrency: 512
  refine_concurrency: 1
  phase2_contract_check_concurrency: 32
  lean_max_inflight_snippets: 48
  lean_batch_size: 8
  lean_parallel_batches: 6

judge: {enabled: false}
