input_predictions: /ssd/czx/czx_work/math_verify_eval/qwen3_5_9b_math_verify/predictions.jsonl
output_base: /ssd/czx/czx_work/cot_blueprint_refine
exp_name: qwen3_5_9b_blueprint_refine
resume: true
include_ids: []
python_bin: /ssd/miniconda3/envs/lean4-czx/bin/python

vllm:
  use_existing: false
  auto_start: true
  auto_destroy: true
  startup_timeout_s: 1800
  shutdown_timeout_s: 180
  poll_interval_s: 2
  cuda_visible_devices: 0,1,2,3,4,5,6,7

kimina:
  auto_start: true
  auto_destroy: true
  root: /ssd/czx/kimina-lean-server
  host: 127.0.0.1
  port: 8000
  startup_timeout_s: 300
  shutdown_timeout_s: 180
  poll_interval_s: 1
  metrics_interval_s: 5
  max_repls: 48
  max_repl_uses: 256
  max_repl_mem: 64G
  max_snippets_per_request: 8
  project_dir: /ssd/czx/goedel-architect/goedel_lean
  repl_path: /ssd/czx/kimina-lean-server/repl/.lake/build/bin/repl

shared_vllm_397b:
  model_path: /ssd/czx/models/Qwen3.5-397B-A17B-FP8
  served_model_name: Qwen3.5-397B-A17B-FP8
  host: 127.0.0.1
  port: 8001
  tensor_parallel_size: 8
  max_model_len: 40960
  max_num_seqs: 512
  gpu_memory_utilization: 0.95
  trust_remote_code: true
  tool_call_parser: qwen3_xml
  enable_auto_tool_choice: true
  extra_args: []

step_splitter:
  model: ${shared_vllm_397b.served_model_name}
  openai_base_url: http://127.0.0.1:8001/v1
  api_key: dummy
  vllm: ${shared_vllm_397b}
  tokenizer_path: ${shared_vllm_397b.model_path}
  temperature: 0.0
  max_tokens: 2048
  concurrency: 24
  timeout_s: 600
  max_attempts: 2
  enable_thinking: false
  target_tokens_per_step: 100
  min_target_steps: 5
  max_target_steps: 16
  prompt_version: formal-step-boundary-v1

blueprint:
  execution_mode: full
  model: Qwen3.5-397B-A17B-FP8
  openai_base_url: http://127.0.0.1:8001/v1
  vllm: ${shared_vllm_397b}
  retry_error_results: false
  # Shared by initial Blueprint generation and Blueprint refinement.
  generation_max_tokens: 16384
  phase1_model_max_context: ${shared_vllm_397b.max_model_len}
  phase1_context_safety_margin: 512
  phase1_max_output_cap: 16384
  phase1_min_output_tokens: 512
  phase3_model_max_context: ${shared_vllm_397b.max_model_len}
  phase3_context_safety_margin: 512
  phase3_max_output_cap: 16384
  phase3_min_output_tokens: 512
  tokenizer_path: ${shared_vllm_397b.model_path}
  # Used by per-node proving and the negation probe.
  prover_max_tokens: 8192
  # Only the current node is upgraded to this limit after a length finish.
  prover_length_retry_max_tokens: 8192
  max_refinement_iterations: 4
  blueprint_max_retries: 4
  node_max_prove_turns: 4
  # Maximum Lean-guided attempts to prove the formal negation after normal proving fails.
  # Set to 0 to disable the negation probe.
  node_max_negation_probe_turns: 1
  max_tool_calls_per_turn: 3
  semantic_fidelity_enabled: false
  semantic_require_step_ids: false
  semantic_static_gate: false
  semantic_minimal_ir: false
  semantic_freeze_refinement: false
  semantic_audit_mode: none
  semantic_audit_max_tokens: 1024
  semantic_max_repair_attempts: 1
  proof_policy: full
  critical_negation_max_turns: 0
  phase1_concurrency: 1024
  phase2_blueprint_concurrency: 1024
  phase2_node_concurrency: 4096
  refine_concurrency: 256
  phase2_contract_check_concurrency: 32
  lean_api_url: http://127.0.0.1:8000
  lean_server_timeout: 600
  lean_max_inflight_snippets: 128
  lean_batch_size: 32
  lean_global_batching: true
  lean_parallel_batches: 6
  lean_batch_wait_ms: 10

export:
  workers: 128

refine:
  model: Qwen3.5-397B-A17B-FP8
  openai_base_url: http://127.0.0.1:8001/v1
  vllm: ${shared_vllm_397b}
  api_key: dummy
  temperature: 0.6
  max_tokens: 20480
  # When false, safely extract the last complete tagged solution and retain any
  # extra/multiple-marker envelope defect as an audit warning instead of paying
  # for a second full generation.
  strict_final_envelope: true
  context_window: 40960
  context_safety_margin: 256
  tokenizer_path: /ssd/czx/models/Qwen3.5-397B-A17B-FP8
  source_solution_model_label: Qwen3.5-9B
  concurrency: 256
  timeout_s: 600
  max_retries: 3
  retry_base_delay_s: 2.0
  retry_max_delay_s: 30.0
  variants:
    blueprint:
      enabled: true
      prompt_mode: blueprint
    cot_only:
      enabled: true
      prompt_mode: cot_only

judge:
  enabled: true
  model: Qwen3.5-397B-A17B-FP8
  openai_base_url: http://127.0.0.1:8001/v1
  api_key: dummy
  temperature: 0.0
  max_tokens: 32
  concurrency: 1024
  timeout_s: 300
  max_retries: 2
  retry_base_delay_s: 2.0
  retry_max_delay_s: 30.0
  vllm: ${shared_vllm_397b}
