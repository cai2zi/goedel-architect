# Full Qwen3-8B evaluation input: 660 raw rows, of which 646 have
# finish_reason=stop and are eligible for the existing prepare stage.
input_predictions: /ssd/czx/czx_work/math_verify_eval/qwen3_8b_math_verify/predictions.jsonl
output_base: /ssd/czx/czx_work/cot_blueprint_refine
exp_name: qwen3_8b_397b_all646_blueprint_generation
resume: true
vllm: {use_existing: true}
shared_vllm_397b: {reasoning_parser: qwen3}
kimina: {use_existing: true, auto_start: false, auto_destroy: false}
step_splitter: {prompt_version: formal-step-boundary-v4, concurrency: 512}

blueprint:
  execution_mode: phase1_only
  generation_max_turns: 8
  generation_enable_thinking: true
  generation_temperature: 0.6
  generation_top_p: 0.95
  generation_top_k: 20
  generation_min_p: 0.0
  generation_presence_penalty: 0.0
  generation_repetition_penalty: 1.0
  generation_model_max_context: 40960
  generation_context_safety_margin: 512
  formal_decompiler_max_tokens: 4096
  strict_comparator_max_tokens: 4096
  semantic_format_max_attempts: 2
  phase1_concurrency: 512
  phase2_contract_check_concurrency: 32
  lean_max_inflight_snippets: 48
  lean_batch_size: 8
  lean_parallel_batches: 6
  max_refinement_iterations: 0

judge: {enabled: false}
