exp_name: null
data_root: /ssd/czx/czx_work/RobustPABench
output_base: /ssd/czx/czx_work/robustpa_refine
model: Qwen3.5-397B-A17B-FP8
openai_base_url: null
tokenizer_path: /ssd/czx/models/Qwen3.5-397B-A17B-FP8
subset: null
split: null
limit: null
problem_id: null
include_source_ids_path: null
resume: false
retry_error_results: false

# full runs Blueprint generation, proving, and COT refinement. phase1_only
# stops after Blueprint generation. phase2_only resumes accepted Phase 1
# checkpoints, proves their nodes once, and requires zero refinement rounds.
execution_mode: full
generation_prompt_profile: whole_cot_minimal
blueprint_root_name: null
generation_node_naming: semantic
phase1_seed_root: null
phase1_source_results_path: null
phase1_source_experiment_root: null
max_refinement_iterations: 4
refinement_max_retries: 4

generation_max_turns: 8
generation_enable_thinking: true
generation_temperature: 0.6
generation_top_p: 0.95
generation_top_k: 20
generation_min_p: 0.0
generation_presence_penalty: 0.0
generation_repetition_penalty: 1.0
generation_model_max_context: 40960
generation_context_safety_margin: 512
phase1_mathlib_search_enabled: false
phase1_mathlib_search_max_queries_per_round: 2
phase1_mathlib_search_k: 3
phase1_mathlib_search_timeout_s: 15
formal_decompiler_max_tokens: 4096
strict_comparator_max_tokens: 4096
semantic_format_max_attempts: 2
semantic_audit_mode: separate
joint_semantic_audit_max_tokens: 32768
semantic_audit_enable_thinking: false
semantic_audit_temperature: 0.0
semantic_audit_top_p: 1.0
semantic_audit_top_k: -1
semantic_audit_min_p: 0.0
semantic_audit_presence_penalty: 0.0
semantic_audit_repetition_penalty: 1.0

node_max_prove_turns: 8
node_max_negation_probe_turns: 1
max_tool_calls_per_turn: 3
proof_policy: full
critical_negation_max_turns: 0
node_timeout_s: null
llm_api_timeout_s: null

phase1_concurrency: 76
phase2_blueprint_concurrency: 512
phase2_node_concurrency: 4096
refine_concurrency: 512
phase2_contract_check_concurrency: 32
lean_max_inflight_snippets: 48
lean_batch_size: 8
lean_global_batching: true
lean_parallel_batches: 6
lean_batch_wait_ms: 10
lean_api_url: http://localhost:8000
lean_api_key_env: KIMINA_API_KEY
lean_server_timeout: 600
lean_server_reuse: true
lean_server_debug: false

environment:
  GOEDEL_PROVER_MAX_TOKENS: "8192"
  GOEDEL_PROVER_ENABLE_THINKING: "true"
  GOEDEL_PROVER_TEMPERATURE: "0.6"
  GOEDEL_PROVER_TOP_P: "0.95"
  GOEDEL_PROVER_TOP_K: "20"
  GOEDEL_PROVER_MIN_P: "0.0"
  GOEDEL_PROVER_PRESENCE_PENALTY: "0.0"
  GOEDEL_PROVER_REPETITION_PENALTY: "1.0"
  GOEDEL_LLM_MAX_RETRIES: "6"
  GOEDEL_LLM_RETRY_BASE_DELAY_S: "2"
  GOEDEL_LLM_RETRY_MAX_DELAY_S: "60"
  GOEDEL_LLM_RETRY_JITTER_S: "1"

hydra:
  job:
    chdir: false
  run:
    dir: ${output_base}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
