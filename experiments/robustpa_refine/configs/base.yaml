exp_name: null
data_root: /ssd/czx/czx_work/RobustPABench
output_base: /ssd/czx/czx_work/robustpa_refine
model: Qwen3.5-397B-A17B-FP8
openai_base_url: null
subset: null
split: null
limit: null
problem_id: null
include_source_ids_path: null
resume: false
# When false, resume treats an existing terminal error as complete.  Set true
# only for an intentional retry of failed records.
retry_error_results: false
# full runs Phase 1/2/3; phase1_only stops after a validated Blueprint.
execution_mode: full
max_refinement_iterations: 4
blueprint_max_retries: 8
phase1_max_tool_turns: 3
phase1_max_tool_calls_per_turn: 3
phase1_mathlib_search_max_calls: 3
phase1b_semantic_audit_enabled: false
phase1b_formal_decompiler_max_tokens: 4096
phase1b_strict_comparator_max_tokens: 4096
phase1b_semantic_format_max_attempts: 2
phase1b_repair_strategy: directEdit
phase1b_editor_attempts_per_turn: 3
phase1b_plan_max_tokens: 768
phase1b_plan_format_attempts: 2
phase1b_plan_max_chars: 600
phase1b_progress_controller_max_tokens: 2048
phase1b_progress_controller_format_attempts: 2
phase1b_subgraph_max_edits: 8
phase1b_seed_blueprint_root: null
phase1b_seed_filename: phase1b_final.lean
phase1b_seed_required: false
node_max_prove_turns: 8
# Set to 0 to disable the formal-negation probe after normal proving fails.
node_max_negation_probe_turns: 1
max_tool_calls_per_turn: 3
# Semantic-fidelity features are opt-in so generic RobustPA callers preserve
# their historical behavior.
semantic_fidelity_enabled: false
semantic_require_step_ids: false
semantic_static_gate: false
semantic_minimal_ir: false
semantic_freeze_refinement: false
semantic_source_mode: step_grounded
# full | first_failed_wave | critical_path
proof_policy: full
critical_negation_max_turns: 0
node_timeout_s: null
llm_api_timeout_s: null
phase1_concurrency: 1024
phase2_blueprint_concurrency: 512
phase2_node_concurrency: 4096
refine_concurrency: 1024
phase2_contract_check_concurrency: 8
lean_max_inflight_snippets: 128
lean_batch_size: 8
lean_global_batching: false
lean_parallel_batches: 1
lean_batch_wait_ms: 10
lean_api_url: http://localhost:8000
lean_api_key_env: KIMINA_API_KEY
lean_server_timeout: 600
lean_server_reuse: true
lean_server_debug: false
environment:
  GOEDEL_BLUEPRINT_MAX_TOKENS: "8192"
  GOEDEL_PROVER_MAX_TOKENS: "4096"
  GOEDEL_LLM_MAX_RETRIES: "6"
  GOEDEL_LLM_RETRY_BASE_DELAY_S: "2"
  GOEDEL_LLM_RETRY_MAX_DELAY_S: "60"
  GOEDEL_LLM_RETRY_JITTER_S: "1"

hydra:
  job:
    chdir: false
  run:
    dir: ${output_base}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
