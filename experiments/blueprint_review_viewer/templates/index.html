<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blueprint Review</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>Blueprint Review <small>只读</small></h1><span id="meta"></span></header>
<main><aside><section class="experimentPicker"><label for="experimentSearch">实验</label><input id="experimentSearch" autocomplete="off" placeholder="粘贴全部/部分 exp_name"><div class="experimentPickerMeta"><span id="experimentCount"></span><span id="currentExperiment"></span></div><div id="experimentOptions"></div></section><input id="filter" disabled placeholder="筛选 source id / subset / status"><div id="cases"></div></aside>
<section id="center"><div class="tabs"><button class="tab active" data-tab="view">查看 Blueprint</button><button class="tab" data-tab="compare">文件对比</button></div><div id="sourceContext"></div><div id="viewPanel" class="panel"><div id="viewCandidates" class="candidateButtons"></div><div id="summary"></div><pre id="code"></pre></div><div id="comparePanel" class="panel hidden"><div class="compareSelectors"><div><b>左侧版本</b><div id="compareLeft" class="candidateButtons"></div></div><div><b>右侧版本</b><div id="compareRight" class="candidateButtons"></div></div></div><div id="diffSummary"></div><div id="fileDiff" class="fileDiff"></div></div></section>
<aside id="rightPane"><h2>最终结果</h2><div id="result"></div><h2 id="roundTitle">本轮反馈</h2><div id="feedback"></div><h2>本轮模型输入/回答</h2><div id="roundArtifacts"></div></aside></main><div id="loading" class="loading hidden" role="status" aria-live="polite"><div class="loadingCard"><span class="spinner"></span><div><b>正在加载 Blueprint 审阅数据…</b><br><small>读取 generation、验证信息与文件差异</small></div></div></div><script src="/app.js"></script></body></html>
