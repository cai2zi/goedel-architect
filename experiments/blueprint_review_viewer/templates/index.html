<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blueprint Review</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>Blueprint Review <small>只读</small></h1><span id="meta"></span></header>
<main><aside><input id="filter" placeholder="筛选 source id / subset / status"><div id="cases"></div></aside>
<section id="center"><div class="tabs"><button class="tab active" data-tab="view">查看 Blueprint</button><button class="tab" data-tab="compare">文件对比</button></div><div id="viewPanel" class="panel"><div id="viewCandidates" class="candidateButtons"></div><div id="summary"></div><pre id="code"></pre></div><div id="comparePanel" class="panel hidden"><div class="compareSelectors"><div><b>左侧版本</b><div id="compareLeft" class="candidateButtons"></div></div><div><b>右侧版本</b><div id="compareRight" class="candidateButtons"></div></div></div><div id="diffSummary"></div><div id="fileDiff" class="fileDiff"></div></div></section>
<aside id="rightPane"><h2>验证与语义</h2><div id="validation"></div><h2>编辑生命周期</h2><div id="edits"></div></aside></main><script src="/app.js"></script></body></html>
